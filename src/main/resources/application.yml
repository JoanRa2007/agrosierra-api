server:
  port: 8080
  address: 0.0.0.0

spring:
  application:
    name: agrosierra-api
  datasource:
    url: jdbc:h2:mem:agrosierra;DB_CLOSE_DELAY=-1
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: create-drop
    open-in-view: false
    properties:
      hibernate.format_sql: true
  h2:
    console:
      enabled: true
      path: /h2-console
  jackson:
    default-property-inclusion: non_null
  mvc:
    throw-exception-if-no-handler-found: true

agro:
  jwt:
    # Clave HMAC-SHA256 en Base64 (min. 256 bits). En produccion se lee de variable de entorno.
    secreto: ${AGRO_JWT_SECRETO:QWdyb1NpZXJyYS1Kb2FuUm9kcmlndWV6LVVQZVUtMjAyNi1DbGF2ZS1Ob1NlQ29tcGFydGU=}
    vigencia-minutos: 60
